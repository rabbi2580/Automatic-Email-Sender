# Local / single-host deployment. For production use managed Postgres/Redis/S3 and put a TLS-terminating proxy in front.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobapply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobapply
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jobapply"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do sleep 1; done; mc mb -p local/jobapply || true"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  api:
    build: ./backend
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg2://jobapply:${POSTGRES_PASSWORD}@postgres:5432/jobapply
      REDIS_URL: redis://redis:6379/0
      TASK_MODE: celery
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: .env
    environment: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    depends_on: [api, redis]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on: [api]
    ports: ["3000:3000"]

volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
